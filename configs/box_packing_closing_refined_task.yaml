# Nero dual-arm refined carton closing / carton rotation preparation config.
# This dataset starts after all boxes are already inside the carton.
# It records only the first side-flap closing and lower-flap push sequence.

dataset:
  repo_id: local/nero_box_packing_closing_refined_v1
  root: <PROJECT_ROOT>/lerobot_data/lerobot_hezi/data_depth/nero_box_packing_closing_refined_v1
  timestamp_root: true
  fps: 15
  episode_seconds: 180
  resume: false
  image_writer_threads: 4
  robot_type: dual_nero_box_packing_closing_refined
  incomplete_dir_name: incomplete

task:
  name: nero_box_packing_refined_carton_closing
  instruction: Close the first side flaps and execute the lower-flap push sequence after the boxes have already been placed inside.
  action_source: kinesthetic_current_feedback_as_same_frame_action_target
  action_note: >
    During master/zero-force kinesthetic collection there is no separate command
    stream sent to the robot controller. The action column records the current
    measured robot state as the same-frame demonstrated joint target; it is not
    the next-frame joint state.

counts:
  mouse_boxes: 0
  earphone_boxes: 0

stages:
  - id: 31
    name: RIGHT_CONTACT_RIGHT_SIDE_FLAP_LOWER_MIDDLE
    prompt_index: 1
    repeat: 1
    display: 右臂抵住右侧扇面下部中间
  - id: 32
    name: LEFT_CONTACT_LEFT_SIDE_FLAP_LOWER_MIDDLE
    prompt_index: 2
    repeat: 1
    display: 左臂抵住左侧扇面下部中间
  - id: 33
    name: BOTH_FOLD_AND_PRESS_SIDE_FLAPS_FLAT
    prompt_index: 3
    repeat: 1
    display: 双臂合拢并压平左右扇面
  - id: 41
    name: BOTH_WITHDRAW_TO_SAFE_POSITION
    prompt_index: 4
    repeat: 1
    display: 双臂撤回到安全位置
  - id: 42
    name: RIGHT_PUSH_FRONT_PART_OF_RIGHT_LOWER_FLAP
    prompt_index: 5
    repeat: 1
    display: 右臂轻推右侧下扇面前部
  - id: 43
    name: LEFT_PUSH_LOWER_OPEN_FLAP_LEFT_EDGE_FROM_LEFT_VIEW
    prompt_index: 6
    repeat: 1
    display: 左臂抵住并轻推张开下扇面左侧边缘
  - id: 44
    name: RIGHT_PUSH_LOWER_OPEN_FLAP_LEFT_EDGE_FROM_RIGHT_VIEW
    prompt_index: 7
    repeat: 1
    display: 右臂抵住并轻推张开下扇面左侧边缘

prompts:
  - prompt_index: 1
    zh: 右臂接近盒子右侧扇面下部，并抵住右侧扇面的中间位置。
    en: Move the right arm toward the lower part of the box's right side flap and brace the middle of the right side flap.
  - prompt_index: 2
    zh: 左臂接近盒子左侧扇面下部，并抵住左侧扇面的中间位置。
    en: Move the left arm toward the lower part of the box's left side flap and brace the middle of the left side flap.
  - prompt_index: 3
    zh: 右臂和左臂同时将左右扇面向箱口内侧合拢，并继续下压使扇面贴近平整。
    en: Use both arms at the same time to fold the left and right side flaps inward toward the carton opening, then press the flaps down until they lie flat.
  - prompt_index: 4
    zh: 双臂从纸箱扇面附近撤回到安全位置，避免阻挡后续对下扇面的推动动作。
    en: Move both arms away from the carton flaps and withdraw to a safe position, clearing space for the subsequent lower-flap pushing actions.
  - prompt_index: 5
    zh: 右臂靠近盒子右侧下扇面的前面部位，并轻轻推动该部位。
    en: Move the right arm toward the front part of the box's right lower flap and gently push that area.
  - prompt_index: 6
    zh: 左臂靠近张开扇面的下方，从左臂视角抵住盒子下扇面的左侧边缘，并轻轻推动。
    en: Move the left arm under the open flap, brace the left edge of the box's lower flap from the left-arm viewpoint, and gently push it.
  - prompt_index: 7
    zh: 右臂靠近张开扇面的下方，从右臂视角抵住盒子下扇面的左侧边缘，并轻轻推动。
    en: Move the right arm under the open flap, brace the left edge of the box's lower flap from the right-arm viewpoint, and gently push it.

events:
  0: NONE
  1: EPISODE_STARTED
  2: SUBTASK_STARTED
  3: MOUSE_BOX_PLACED
  4: EARPHONE_BOX_PLACED
  5: STAGE_COMPLETED
  6: EPISODE_SUCCESS
  7: EPISODE_FAILED
  8: EPISODE_DISCARDED

failure_types:
  - none
  - flap_contact_failed
  - flap_missed
  - flap_reopened
  - carton_slipped
  - carton_rotation_failed
  - carton_over_rotated
  - carton_under_rotated
  - flap_closing_failed
  - collision
  - timeout
  - manual_abort
  - other

keys:
  space: advance
  s: save_success
  f: save_failure
  g: discard_episode
  q: quit

cameras:
  rgb:
    width: 640
    height: 480
    fps: 15
    fourcc: MJPG
    storage: video
    left_wrist: /dev/video2
    right_wrist: /dev/video4
    third_view: /dev/video6
    manual_controls: {}
  depth:
    enabled: true
    camera_names: [third_view]
    backend: orbbec_v1
    width: 640
    height: 480
    fps: 15
    storage: video
    min_mm: 250
    max_mm: 1800
    colorize: gray
    open_timeout: 10
    raw_format: png
    raw_png_compression: 1
    third_view_serial: <THIRD_CAM_SERIAL>

can:
  bitrate: 1000000
  interface: socketcan
  timeout: 1.0
  left_serial: "<LEFT_CAN_SERIAL>"
  right_serial: "<RIGHT_CAN_SERIAL>"
  left_firmware: v120
  right_firmware: v120
  default_left_can: can0
  default_right_can: can1
  resolve_by_serial: true

safety:
  enable: false
  drag_teach: false
  speed_percent: 5
  mode_settle_seconds: 0.5
